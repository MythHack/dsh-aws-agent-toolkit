name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bundle:
    name: verify bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate manifests
        shell: bash
        run: |
          node -e "for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('json ok')"

      - name: Verify bundled skills
        run: npm run verify

      - name: Check package contents
        run: npm pack --dry-run
